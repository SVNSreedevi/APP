name: Backend Security Review

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install WebE2E Dependencies (for exceljs)
        working-directory: ./WebE2E
        run: npm install

      - name: Run Backend Security Suite
        working-directory: ./server
        env:
          NODE_PATH: ../WebE2E/node_modules
        run: node scripts/generateSecuritySuite.js

      - name: Enforce Zero-Critical Security Gate
        run: |
          cat server/security_reports/executive-summary.md >> $GITHUB_STEP_SUMMARY
          CRITICAL_COUNT=$(grep -oP '\|\s*\*\*Critical\*\*\s*\|\s*\K\d+' server/security_reports/executive-summary.md)
          echo "Critical vulnerabilities found: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Security Gate Failed: Found $CRITICAL_COUNT critical vulnerabilities!"
            exit 1
          fi
