name: API Load Testing

on:
  push:
    paths:
      - 'Bloodloss and Fluidloss Monitor SystemBackend/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    paths:
      - 'Bloodloss and Fluidloss Monitor SystemBackend/**'

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        id: k6_run
        env:
          BACKEND_URL: 'https://ai-bloodloss-estimator.onrender.com'
        run: |
          k6 run --summary-export=summary.json "Bloodloss and Fluidloss Monitor SystemBackend/scripts/load-test.js" || true

      - name: Parse Summary & Publish to GHA Step Summary
        run: node "Bloodloss and Fluidloss Monitor SystemBackend/scripts/parseK6Summary.js"
