name: Android Appium E2E (1100+)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages-android"
  cancel-in-progress: false

jobs:
  android-e2e-tests:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Appium Framework Dependencies
      run: |
        cd AIBloodLossEstimatorFluidMonitorAppium
        npm install
        npx appium driver install uiautomator2 || true

    - name: Install Expo & Build Debug APK
      run: |
        cd mobile-app
        npm install
        # Generate the android native folder
        npx expo prebuild -p android --clean
        # Build the APK
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Make CI Script Executable
      run: chmod +x AIBloodLossEstimatorFluidMonitorAppium/scripts/ci_run_tests.sh

    - name: Enable KVM for Android Emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Appium Tests on Emulator
      uses: reactivecircus/android-emulator-runner@v2
      env:
        # Path to the generated APK
        APK_PATH: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
        # Pass flags to WDIO CLI to prevent ts-node ESM loader error on Node 20
        WDIO_CLI_ARGS: --autoCompileOpts.autoCompile=false
      with:
        api-level: 29
        profile: Nexus 6
        target: default
        arch: x86
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: ./AIBloodLossEstimatorFluidMonitorAppium/scripts/ci_run_tests.sh

    - name: Gather Reports for Deployment
      if: always()
      run: |
        mkdir -p deploy_reports/reports/latest
        mkdir -p deploy_reports/reports/history/build-${{ github.run_number }}
        cp AIBloodLossEstimatorFluidMonitorAppium/execution-report.html deploy_reports/reports/latest/execution-report.html || true
        cp AIBloodLossEstimatorFluidMonitorAppium/execution-report.html deploy_reports/reports/history/build-${{ github.run_number }}/execution-report.html || true
        cp AIBloodLossEstimatorFluidMonitorAppium/execution-report.xlsx deploy_reports/reports/latest/execution-report.xlsx || true
        
    - name: Deploy HTML Reports to GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: deploy_reports
        branch: gh-pages
        clean: false

