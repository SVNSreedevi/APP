name: E2E Tests & Deploy to Pages

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm install

      - name: Build Client (Vite)
        working-directory: ./client
        run: npm run build
        
      - name: Start Vite Preview Server Background
        working-directory: ./client
        # The prompt asked for: npx vite preview --port 5173 --host 127.0.0.1 --base /Bloodloss and Fluidloss Monitor System-project/ &
        # We start this pointing to the dist we just built
        run: npx vite preview --port 5173 --host 127.0.0.1 --outDir dist &

      - name: Wait and Verify Local Server
        run: |
          sleep 4
          curl -s --head http://127.0.0.1:5173/ || (echo "Vite server failed to start" && exit 1)
          echo "TEST_BASE_URL=http://127.0.0.1:5173/" >> $GITHUB_ENV

      - name: Install E2E Dependencies
        working-directory: ./WebE2E
        run: npm install

      - name: Run 1,100 Assertions Mega E2E Suite
        working-directory: ./WebE2E
        run: npm test

      - name: Run Web Security Suite
        working-directory: ./WebE2E
        env:
          NODE_PATH: ./node_modules
        run: node scripts/generateWebSecuritySuite.js

      - name: Enforce Zero-Critical Security Gate
        run: |
          cat WebE2E/security_reports/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          CRITICAL_COUNT=$(grep -oP '\|\s*\*\*Critical\*\*\s*\|\s*\K\d+' WebE2E/security_reports/web-executive-summary.md)
          echo "Critical vulnerabilities found: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Security Gate Failed: Found $CRITICAL_COUNT critical vulnerabilities!"
            exit 1
          fi

      - name: Inject E2E HTML Report into Dist
        run: |
          mkdir -p client/dist/reports/latest
          mkdir -p client/dist/reports/history/build-${{ github.run_number }}
          cp WebE2E/Test_Results/HTML/execution-report.html client/dist/reports/latest/execution-report.html
          cp WebE2E/Test_Results/HTML/execution-report.html client/dist/reports/history/build-${{ github.run_number }}/execution-report.html

      - name: Write Step Summary
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("WebE2E/Test_Results/report-data.json", "utf8"));
            const passRate = ((data.totalPass / data.total) * 100).toFixed(2);
            const duration = (data.results.reduce((acc, curr) => acc + curr.duration, 0) / 1000).toFixed(2);
            
            const summary = `### 📊 E2E Web Test Execution Summary (Build #${{ github.run_number }})\n\n` +
              `| Metric | Value | Status |\n` +
              `| --- | --- | --- |\n` +
              `| **Total Tests** | ${data.total} | 📝 |\n` +
              `| **Passed** | ${data.totalPass} | ✅ |\n` +
              `| **Failed** | ${data.totalFail} | ${data.totalFail === 0 ? "➖" : "❌"} |\n` +
              `| **Pass Rate** | ${passRate}% | 🏆 |\n` +
              `| **Duration** | ${duration}s | ⏱️ |\n\n` +
              `🌐 **Native GitHub Pages Deployment**\n`;
              
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
